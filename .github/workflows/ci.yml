name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Build and test
        shell: pwsh
        run: ./eng/Test-Backend.ps1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # The stage 2 validator renders mocks in Chromium.
      - run: npx playwright-core install --with-deps chromium
      # The scripted agent records each increment's stand-in video with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scaffold:
    name: Scaffold template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      # Stage 6's default template must pass the same commands its own CI runs (L2-015 AC2).
      - run: node worker/src/scaffold/generate-cli.ts "$RUNNER_TEMP/scaffold"
      - run: dotnet build *.slnx && dotnet test *.slnx --no-build
        working-directory: ${{ runner.temp }}/scaffold/backend
      - run: npm install && npm run lint && npm run build && npm test
        working-directory: ${{ runner.temp }}/scaffold/frontend
      - run: npm install && CI=1 npm test
        working-directory: ${{ runner.temp }}/scaffold/e2e

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [backend, frontend, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
            worker/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: worker
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # The scripted worker records each increment's walkthrough with ffmpeg (journey 19's live video test).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: dotnet build backend/Hewn.sln
      - run: npm run test:behavior
        working-directory: e2e
      - run: npm run test:a11y
        working-directory: e2e
      - run: npm run test:visual
        working-directory: e2e
      - run: npm run test:pipeline
        working-directory: e2e
        # The workers' own log lines (which worker leased which run, cancels heard) explain a pipeline failure.
        env:
          HEWN_E2E_WORKER_LOGS: '1'
      # L2-045: Lighthouse on the production build of Projects, and the read-API load test.
      - run: npm run test:perf
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
